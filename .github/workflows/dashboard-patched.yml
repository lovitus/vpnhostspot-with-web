name: Dashboard patched source

on:
  push:
    branches: [master, agent/web-review-fixes, agent/web-lock-fix, agent/integrated-final, agent/dashboard-complete]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dashboard-patched-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    if: github.ref == 'refs/heads/master' || github.ref == 'refs/heads/agent/web-review-fixes' || github.ref == 'refs/heads/agent/web-lock-fix' || github.ref == 'refs/heads/agent/integrated-final' || github.ref == 'refs/heads/agent/dashboard-complete'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Replay dashboard patch on exact p4 source
        run: |
          git fetch https://github.com/lovitus/VPNHotspot.git ae6f39ed82153b5edf6c797bc1a27e17ab5ee845
          git worktree add --detach patched ae6f39ed82153b5edf6c797bc1a27e17ab5ee845
          git -C patched apply --check "$GITHUB_WORKSPACE/patches/0005-web-admin.patch"
          git -C patched apply "$GITHUB_WORKSPACE/patches/0005-web-admin.patch"
          git -C patched submodule update --init --recursive
          sha256sum patches/0005-web-admin.patch
          git -C patched diff --stat
      - name: Check request path isolation before compilation
        env:
          VPNHOTSPOT_SOURCE: ${{ github.workspace }}/patched
        run: python3 -m unittest discover -s tests -p 'test_web_dashboard_lifecycle.py' -v
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v6
      - name: Install SDK packages on hosted runner
        run: sdkmanager "platforms;android-37.0" "build-tools;37.0.0" "ndk;29.0.14206865"
      - name: Compile and run Android JVM unit tests on patched source
        working-directory: patched
        run: ./gradlew :mobile:compileDebugKotlin :mobile:testDebugUnitTest --no-daemon --console=plain
      - name: Execute production Kotlin behavior tests
        env:
          DASHBOARD_PAGE_OUTPUT: ${{ runner.temp }}/dashboard.html
        run: python3 tests/run_dashboard_behavior.py "$GITHUB_WORKSPACE/patched"
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Exercise compiled production page in Chromium
        run: |
          npm install --prefix "$RUNNER_TEMP/dashboard-browser" playwright@1.56.1
          "$RUNNER_TEMP/dashboard-browser/node_modules/.bin/playwright" install --with-deps chromium
          NODE_PATH="$RUNNER_TEMP/dashboard-browser/node_modules" node tests/dashboard_browser.cjs "$RUNNER_TEMP/dashboard.html" "$RUNNER_TEMP"
      - name: Check Android lifecycle wiring
        env:
          VPNHOTSPOT_SOURCE: ${{ github.workspace }}/patched
        run: python3 -m unittest discover -s tests -p 'test_web_dashboard_lifecycle.py' -v
      - name: Check Rust formatting and Android compilation
        working-directory: patched/mobile/src/main/rust/vpnhotspotd
        run: |
          rustup target add aarch64-linux-android
          cargo fmt -- --check
          cargo check --locked --target aarch64-linux-android
          cargo clippy --locked --target aarch64-linux-android --all-targets -- -D warnings
      - name: Execute DNS wire behavior tests
        run: |
          rustc --test patched/mobile/src/main/rust/vpnhotspotd/src/shared/dns_wire.rs -o "$RUNNER_TEMP/dashboard-dns-tests"
          "$RUNNER_TEMP/dashboard-dns-tests"
      - name: Execute production retired DNS and NAT66 counter regressions
        working-directory: patched/mobile/src/main/rust/vpnhotspotd
        run: |
          cargo test --locked --lib shared::dns_counter::tests
          cargo test --locked --lib shared::nat66_counter::tests
      - name: Preserve reports and exact patch
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dashboard-validation
          path: |
            patches/0005-web-admin.patch
            patched/mobile/build/reports/tests/
            patched/mobile/build/test-results/
            ${{ runner.temp }}/dashboard.html
            ${{ runner.temp }}/dashboard-desktop.png
            ${{ runner.temp }}/dashboard-mobile.png
          if-no-files-found: warn
